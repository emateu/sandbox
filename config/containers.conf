# Rootless podman inside the sandbox: no systemd, so no systemd cgroups/journald.
# The [containers] block undoes docker's /proc masking for nested containers and
# skips default sysctls (ping_group_range is read-only in here).
[containers]
volumes = ["/proc:/proc"]
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
